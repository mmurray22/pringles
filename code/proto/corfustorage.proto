syntax="proto3";

package corfustorage;

message Payload {
    int64 packet_type = 1;
    optional errWritten err_written = 2;
    optional Read read = 3;
    optional Seal seal = 4;
}

message errWritten {
    string content = 2;
}

message Read {
    string content = 2;
}

message Seal {
    int64 highaddr = 2;
}