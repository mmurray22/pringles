###### THIS IS WHERE WE DEFINE EXPERIMENT VARIABLES USED FOR ALL EXPERIMENTS ########

###### Should have all the network information for the components of the system which are run on servers #######
[network_setup]
###### Storage server Network Information #####
# This is the port the storage server(s) will be receiving info on
# There is one receive port per machine, current assumption is each machine has one storage server
stor_recv_port = "30003"
# This is the mac address of every storage server being used
stor_macs = ["42:01:0a:00:00:06", "42:01:0a:00:00:07", "42:01:0a:00:00:08", "42:01:0a:00:00:09", "42:01:0a:00:00:10", "42:01:0a:00:00:11"]
# This is the IP address of every storage server being used
stor_ips = ["10.0.0.6", "10.0.0.7", "10.0.0.8","10.0.0.9", "10.0.0.10", "10.0.0.11"]
# This is the network interface the storage servers use to send/receive
stor_net_ifs = ["ens4", "ens4", "ens4","ens4", "ens4", "ens4"] 
######## Client Network Info #######
# This is the mac address of every client machine
cli_macs = ["42:01:0a:00:00:04"]
# This is the IP address of every client machine
cli_ips = ["10.0.0.4"]
# This is the network interface the client machines use to send/receive
cli_net_ifs = ["ens4"]
####### Switch Network information ########
# NOTE : Only one software switch is supported at this time. I will need to update this TODO
# This is the IP address of the software switch
switch_ip = "10.0.0.5"
# This is the receive port of the software switch
switch_recv_port = "30002"
# This is the network interface the software switch uses to send/receive
switch_net_if = "ens4"
# This is the mac address of every switch machine
switch_mac = "42:01:0a:00:00:05"
###### Authentication Information for the switch #######
# NOTE: I don't know if I need this if ssh key forwarding is used? Might deprecate TODO
# SSH key 
ssh_key = "/home/mathwiz23pi/.ssh/gcloud"
# SSH username
ssh_user = "mathwiz23pi" # Added for complete SSH command

######## Should contain the necessary information to figure out what programs are being run where (and also the setup script?) #######
[program_paths]
# This is the full path to the client binary that will be run on all clients
path_client = "/home/mathwiz23pi/pringles/build/experiments/unit_tests/cli"
# Name of the actual client binary 
client_binary = "cli"
# This is the full path to the storage server binary that will be run on all storage servers
path_server = "/home/mathwiz23pi/pringles/build/experiments/unit_tests/stor"
# Name of the actual storage binary 
server_binary = "stor"
# This is the full path to the software switch binary that will be run on all software switches
path_switch = "/home/mathwiz23pi/pringles/build/experiments/unit_tests/switch"
switch_binary = "switch"
# Boolean indicating whether the install script should be run to install packages on all machines
# Generally safe to set to "False"
run_setup_script = "False"

######## Defines variables necessary for experiments #######
[experiment_parameters]
json_name = "default"
# Indicates whether we send raw or UDP sockets. Should always be UDP as of now
socket_type = "UDP"
# How many storage threads there should be handling appends/reads
# NOTE: This is a bit ill-defined at the moment, I would leave at 1 for now TODO
num_storage_threads = 1
# This indicates how many acknowledgements the client will need in order to 
num_failures = 0
# Supposed to be the git hash of the code that we are using for this experiment
git_hash = "1b0aec5ee4e12df008d835842cafe794b9e77615" # TODO
# Boolean indicates whether the current experiments use the switch or not (if not then cli <-> storage servers)
use_switch = 1
# Boolean indicates whetehr the current experiments use the HARDWARE switch or not TODO actually don't use this yet, is it needed?
use_hardware_switch = 0
# Boolean indicates whether the current experiments use the storage server or not (if not then cli <-> switches)
use_store = 1
# Boolean indicates whether the current experiments do sharding or not (if not then cli sends to all storage servers)
use_shard = 1
# Number of packets in a batch
batch_size = 1 # Number of packets
# Whether batching will be used or not...
batch_on = false
# How long to wait until sending a batch off
batch_usec_timeout = 460
# indices of the switches active in the ring, list of unique values, each val 0 <= v <= MAX_NUM_SWITCHES
switches_in_ring = [2, 3] 
#  I'm going to be honest, I don't quite remember what this was for atm. Just keep it false?
with_tunnel = false
# This is meant to indicate what x variable we want to plot on the final graphs
# Right now it only supports plotting by number of switches in the ring or by number of clients 
#  Boolean indicating that the streaming interface is being used
use_streams = 0
# Shard size
num_servers_per_shard = 2
# Number of acks needed before replying to the client
ack_threshold = 1
# Boolean indicating whether ack counting is done in the switch or the client
use_client_count_acks = 0

