# Kafka comparison experiment config.
#
# Cluster layout (1 broker + 1 client, same subnet as Pringles experiments):
#   seq_ips  = Kafka broker node(s)
#   cli_ips  = kafka-log producer/consumer client
#   stor_ips = [] (Kafka brokers handle both ordering and storage)
#
# NOTE: replication_factor must be <= len(seq_ips). With a single broker, set
# replication_factor = 1. To test RF=2, add a second IP to seq_ips and update
# num_sequencer_nodes accordingly.
#
# NOTE: kafka-log's Producer is single-threaded. num_client_threads has no effect
# on Kafka load; it is kept here only for schema consistency. To scale Kafka load,
# run multiple Producer instances (not yet implemented).

[system]
name = "kafka"

[network_setup]
seq_ips     = ["10.10.1.3"]           # Kafka broker node(s)
stor_ips    = []                       # unused for Kafka; brokers live in seq_ips
cli_ips     = ["10.10.1.2"]           # kafka-log producer+consumer client
cli_net_ifs = ["enp23s0f0np0"]
ssh_key  = "/proj/ove-PG0/murray/cloudlab"
ssh_user = "murray22"

[program_paths]
# Path where the Kafka broker distribution will be installed on broker nodes.
kafka_dir     = "/opt/kafka"
# Local path where kafka-log will be cloned and built (sbt assembly).
# The fat jar is then SCP'd to client nodes; the repo itself stays local.
kafka_log_local_src = "/tmp/kafka-log-build"
# Full remote path where the fat jar will be placed on client nodes.
kafka_log_jar_remote = "/proj/ove-PG0/murray/kafka-log-assembly.jar"
# Full URL to a Kafka .tgz release. Update the version as needed.
# Find releases at: https://kafka.apache.org/downloads
kafka_download_url = "https://downloads.apache.org/kafka/3.7.0/kafka_2.13-3.7.0.tgz"
# Set to "True" to clone/build on first run. Safe to leave "True" on repeat runs
# (clone is skipped if the directory already exists).
run_comparison_setup = "True"
run_setup_script = "False"

[comparison_parameters]
num_sequencer_nodes = 1   # number of Kafka brokers; must equal len(seq_ips)
num_shards          = 1   # maps to num_partitions for Kafka
replication_factor  = 1   # must be <= num_sequencer_nodes
num_partitions      = 1   # should equal num_shards

[experiment_parameters]
experiment_name     = "kafka_baseline"
json_name           = "kafka"
experiment_duration = 30    # seconds (excluding warm_up and cool_down)
warm_up             = 5     # seconds
cool_down           = 5     # seconds
message_size        = 100   # bytes
num_client_threads  = 1     # no effect for kafka-log; kept for schema consistency
log_level           = 6
num_failures        = 0

# --- Experiment sweep: 100-byte messages ---
[[experiment]]
message_size = 100
json_name    = "kafka_100b"

# --- Experiment sweep: 4 KB messages ---
[[experiment]]
message_size = 4096
json_name    = "kafka_4kb"
