path_server = "/proj/ove-PG0/murray/pringles/build/experiments/unit_tests/net_stor"
path_switch = "/proj/ove-PG0/murray/pringles/build/experiments/unit_tests/net_seq"
run_setup_script = "False"

[experiment_parameters]
log_level = 6
warm_up = 5 # seconds
cool_down = 5 # seconds
experiment_duration = 30 # seconds
socket_type = "UDP" # "RAW"
message_size = 100 # 100 # bytes
num_client_threads = 1
num_storage_threads = 1
json_name = "increase_batch"
experiment_name = "100byte_onlystor_batch"
num_failures = 0 # NEW
git_hash = "" # TODO
use_switch = 1
use_store = 1
batch_size = 1 # Number of packets
batch_usec_timeout = 460

[protocol_batching]
batch_on = true
num_packet_types = 1
sequencer_type = 0 
storage_server_type = 0 

[routing]
list_client_dest_ips = ["10.10.1.1"]
list_storage_server_dest_ips = ["10.10.1.3"]
client_dest_macs = ["90:e2:ba:38:38:88"]
server_dest_macs = ["90:e2:ba:05:d7:40"] # TODO Change name this is so confusing

[switches]
tofino_model = "/root/bf-sde-9.4.0/run_tofino_model.sh"
switchd = "/root/bf-sde-9.4.0/run_switchd.sh"
ptf_test = "/root/bf-sde-9.4.0/run_ptf_test.sh"
arch = "tofino"
program = "sequencing_only"
loopback_port = 68
switch_port_matrix = [[0, 1, 2, 3], [63, 64, 65, 66], [31, 32, 33, 34], [140, 141, 142, 143]] # Dummy port values

[cpu_dataplane]
udp_sport = 309
cpuTofinoInterface = "enp5s0"
clientInterface = "ma1"

