[network_setup]
# Storage server information
stor_ips = ["10.0.0.6", "10.0.0.7", "10.0.0.8"]
stor_recv_port = "30003"
stor_macs = ["42:01:0a:00:00:06", "42:01:0a:00:00:07", "42:01:0a:00:00:08"]
stor_net_ifs = ["ens4", "ens4", "ens4"] 
# Client information
cli_ips = ["10.0.0.4"]
cli_net_ifs = ["ens4"]
cli_macs = ["42:01:0a:00:00:04"] #, "40:a6:b7:c3:51:58"] # TODO: Deprecated
# Switch information
switch_ip = "10.0.0.5"
switch_recv_port = "30002"
switch_net_if = "ens4"
switch_mac = "42:01:0a:00:00:05" # TODO: Deprecated
ssh_key = "/home/mathwiz23pi/.ssh/gcloud"
ssh_user = "mathwiz23pi" # Added for complete SSH command

[program_paths]
path_client = "/home/mathwiz23pi/pringles/build/experiments/unit_tests/cli"
path_server = "/home/mathwiz23pi/pringles/build/experiments/unit_tests/stor"
path_switch = "/home/mathwiz23pi/pringles/build/experiments/unit_tests/switch"
run_setup_script = "False"

[experiment_parameters]
log_level = 1
warm_up = 5 # seconds
cool_down = 5 # seconds
experiment_duration = 30 # seconds
socket_type = "UDP" # "RAW"
message_size = 4000 # 100 # bytes
num_client_threads = 1
num_storage_threads = 1
json_name = "gcp_client"
experiment_name = "4KB_shard_exp"
num_failures = 0 # NEW
git_hash = "1b0aec5ee4e12df008d835842cafe794b9e77615" # TODO
use_switch = 1
use_store = 1
batch_size = 1 # Number of packets
batch_usec_timeout = 460

[protocol_batching]
batch_on = true
num_packet_types = 1
sequencer_type = 0 
storage_server_type = 0 

[routing]
list_client_dest_ips = ["10.0.0.4"]
switch_ip = "10.0.0.5"
list_storage_server_dest_ips = ["10.0.0.6", "10.0.0.7", "10.0.0.8"]
client_dest_macs = ["42:01:0a:00:00:04"]
server_dest_macs = ["42:01:0a:00:00:06", "42:01:0a:00:00:07", "42:01:0a:00:00:08"]

