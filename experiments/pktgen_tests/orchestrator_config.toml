# orchestrator_config.toml
#
# Ring members are now [switch_id, pipe_id] pairs, IN RING ORDER, matching the
# topology diagram exactly:
#   S4.P0 -> S4.P1 -> S1.P0 -> S1.P1 -> S2.P0 -> S2.P1 -> S3.P0 -> S3.P1 -> (S4.P0)
# using the numeric switch_ids already assigned to S1=3, S2=2, S4=0, S5=1
# (adjust these two mappings if your actual switch_id <-> label assignment differs).
ring_topo = [[3, 1], [0, 0]] #[3, 1]] # [0, 0], [0, 1], [1, 0], [1, 1], [2, 0], [2, 1]]

# Sweep how many ring members (pipes) are active, using PREFIXES of ring_topo above.
# [1, 2] runs the experiment first with only ring_topo[:1] (just switch 3 pipe 0),
# then again with ring_topo[:2] (switch 3 pipes 0 and 1). Leave commented out /
# remove entirely to automatically test every prefix length from 1 through
# len(ring_topo).
ring_sizes_to_test = [1] # TODO: Ok I think I know what the issue is - you need a way to encode just a single pipeline and thus control port should truly be loopback or if it's two pipelines then the control port needs to send between the different ports. Close to sending across multiple switches! Also need to push to codeberg.

# Indexed as [switch_id][pipe_id] -> per-target-switch-id port list.
# ports_to_ring_members[sw][pipe][X] means:
#   - if X == sw (this switch's own id): the RELAY port used to reach the OTHER
#     pipe on THIS SAME switch (intra-chip hop, no cable involved -- must be a
#     devport physically in the other pipe, configured in loopback mode).
#   - if X != sw: the real front-panel port on THIS (switch, pipe) that has a
#     cable running to switch X (inter-switch hop, unchanged from before).
#
# PLACEHOLDER VALUES: the relay-port entries below (marked) are illustrative.
# You must set them to whichever spare devport in the OTHER pipe you're
# dedicating purely to receiving the cntrl packet -- it must NOT be the same
# port that pipe already uses for its own packet generation.
ports_to_ring_members = [
    [0, 148, 164, 180],   # switch 0: [pipe0 map, pipe1 map] (69 = relay, PLACEHOLDER)
    [132, 0, 164, 180],   # switch 1
    [128, 144, 0, 176],   # switch 2
    [132, 148, 164, 0]    # switch 3
]

ports_to_pipelines_per_switch = [
    [44, 156],   # switch 0: [pipe0 map, pipe1 map] (69 = relay, PLACEHOLDER)
    [44, 156],   # switch 1
    [32, 152],   # switch 2
    [52, 188]    # switch 3
]

# Indexed as [switch_id][pipe_id] -> list of ports to hold in loopback for the
# sequencing/recirculation experiment itself (unrelated to the ring relay port
# above). Split from the original flat lists using the pipe-encoding boundary:
# devport >= 128 belongs to pipe 1, devport < 128 belongs to pipe 0.
